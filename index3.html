<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1 | CyberCore - Mykhailo</title>
    <style>
        :root { --neon: #0ff; --bg: #050505; --text: #fff; }
        body { font-family: 'Courier New', Courier, monospace; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .terminal { background: rgba(0,255,255,0.03); border: 2px solid var(--neon); padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,255,255,0.2), inset 0 0 10px rgba(0,255,255,0.1); position: relative; max-width: 500px; text-align: center; }
        .terminal::before { content: 'SYSTEM_STATUS: ONLINE'; position: absolute; top: -12px; left: 20px; background: var(--bg); padding: 0 10px; color: var(--neon); font-size: 0.8em; letter-spacing: 2px; }
        h1 { font-size: 2.5em; text-transform: uppercase; letter-spacing: 5px; color: var(--text); text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px var(--neon), 0 0 20px var(--neon), 0 0 30px var(--neon); animation: flicker 2s infinite; }
        p { line-height: 1.6; opacity: 0.8; }
        .student-info { color: var(--neon); font-weight: bold; font-size: 1.2em; margin-top: 20px; }
        @keyframes flicker { 0%, 18%, 22%, 25%, 38%, 100% { opacity: 1; text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px var(--neon), 0 0 20px var(--neon); } 19%, 21%, 23%, 24% { opacity: 0.2; text-shadow: none; } }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>Lab_01//Loaded</h1>
        <p>Cybernetic Core Interface initialized. LittleFS partition accessed successfully. Static resource delivery stable.</p>
        <p class="student-info">Operator: Mykhailo_//_Unidentified_Subject</p>
    </div>
</body>
</html>
