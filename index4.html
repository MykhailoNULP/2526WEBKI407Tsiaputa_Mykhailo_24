<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL_WIFI_CONFIG</title>
    <style>
        :root { --main: #ffcc00; --bg: #1a1a1a; }
        body { background: var(--bg); color: var(--main); font-family: 'Courier New', monospace; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .config-box { border: 2px solid var(--main); padding: 30px; border-radius: 4px; box-shadow: 0 0 20px rgba(255, 204, 0, 0.2); width: 90%; max-width: 350px; }
        h2 { font-size: 1.2rem; border-bottom: 2px solid var(--main); padding-bottom: 10px; margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: transparent; border: 1px solid var(--main); color: var(--main); box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--main); border: none; color: black; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 15px #fff; }
        .footer { font-size: 0.7rem; margin-top: 20px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="config-box">
        <h2>>> SYSTEM_CONFIG_STATION</h2>
        <p>Enter local network credentials to link the CyberCore module.</p>
        <form action="/save" method="POST">
            <input type="text" name="ssid" placeholder="Network SSID" required>
            <input type="password" name="pass" placeholder="Password" required>
            <button type="submit">TRANSMIT DATA</button>
        </form>
        <div class="footer">
            Operator: Mykhailo_ID_883<br>
            Hardware: ESP32_Dev_Module
        </div>
    </div>
</body>
</html>
